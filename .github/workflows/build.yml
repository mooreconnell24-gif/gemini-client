name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-jar
          path: build/libs/*.jar
      - name: Launch smoke test (client to title screen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_X11_FORCE_EGL=1 SDL_VIDEO_FORCE_EGL=1
          set +e
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            ./gradlew runClient --no-configuration-cache > client.log 2>&1
          code=$?
          set -e
          grep -E "Created: .*atlas|ERROR|Mixin" client.log | grep -v flite | head -40 || true
          if ls run/crash-reports/*.txt > /dev/null 2>&1; then
            echo "::error::The client crashed on startup"; cat run/crash-reports/*.txt | head -80; exit 1
          fi
          if [ "$code" -ne 124 ]; then
            echo "::error::The client exited early (code $code)"; tail -60 client.log; exit 1
          fi
          grep -q "Created: .*atlas" client.log || { echo "::error::The client never finished loading resources"; tail -60 client.log; exit 1; }
