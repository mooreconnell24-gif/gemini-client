name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: gemini-jar
          path: build/libs/*.jar
      - name: Launch smoke test (built jar to title screen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_X11_FORCE_EGL=1 SDL_VIDEO_FORCE_EGL=1
          set +e
          timeout 300 ./gradlew prodClient --no-configuration-cache > client.log 2>&1
          code=$?
          set -e
          log=run-prod/logs/latest.log
          [ -f "$log" ] || log=client.log
          sed -n '/Loading [0-9]* mods/,/^\[/p' "$log" | head -30
          grep -E "Created: .*atlas|ERROR|Mixin" "$log" | grep -v flite | head -40 || true
          if ls run-prod/crash-reports/*.txt > /dev/null 2>&1; then
            echo "::error::The client crashed on startup"; cat run-prod/crash-reports/*.txt | head -80; exit 1
          fi
          if [ "$code" -ne 124 ]; then
            echo "::error::The client exited early (code $code)"; tail -80 client.log; exit 1
          fi
          grep -q "Created: .*atlas" "$log" || { echo "::error::The client never finished loading resources"; tail -60 "$log"; exit 1; }
          grep -q -- "- gemini " "$log" || { echo "::error::Gemini was not loaded"; exit 1; }
          grep -q -- "- baritone-fork" "$log" || { echo "::error::The bundled Baritone was not loaded"; exit 1; }
