name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-configuration-cache --stacktrace 2>&1 | tee build.log
      - name: Launch smoke test (client to title screen)
        if: success()
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          mkdir -p run/mods /tmp/out
          if git fetch -q origin bundle-baritone 2>/dev/null; then
            git show FETCH_HEAD:gemini-3.0.0.jar > /tmp/bundled.jar && unzip -p /tmp/bundled.jar META-INF/jars/baritone-1.20.0.jar > run/mods/baritone-1.20.0.jar || true
          fi
          ls -la run/mods
          export LIBGL_ALWAYS_SOFTWARE=1
          (timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-configuration-cache > /tmp/out/client.log 2>&1; echo "exit $?" >> /tmp/out/client.log) || true
          cp run/logs/latest.log /tmp/out/latest.log 2>/dev/null || true
          mkdir -p /tmp/out/crash && cp run/crash-reports/* /tmp/out/crash/ 2>/dev/null || true
          grep -E "Mixin apply|InvalidInjection|MixinTransformerError|crash|Sound engine started|Created: .*atlas|Exception" /tmp/out/client.log | head -40 || true
      - name: Probe Minecraft classes
        if: always()
        run: |
          .github/scripts/probe.sh
      - name: Publish build output to ci-out branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26\.3[^<]*</version>' | tail -5 > /tmp/out/fabric-api-26.3-versions.txt || true
          curl -s https://meta.fabricmc.net/v2/versions/loader | grep -o '"version": *"[^"]*"' | head -3 > /tmp/out/loader-versions.txt || true
          cd /tmp/out
          git init -q -b ci-out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-out:ci-out-${GITHUB_REF_NAME}
