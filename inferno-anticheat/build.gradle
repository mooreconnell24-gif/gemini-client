plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

sourceSets {
	// End-to-end tests that run inside a real dedicated server (./gradlew runScenarioServer).
	scenario {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"inferno" {
			sourceSet sourceSets.main
		}
		"inferno_scenarios" {
			sourceSet sourceSets.scenario
		}
	}

	runs {
		client {
			client()
			configName = "Minecraft Client"
			ideConfigGenerated = true
			runDir = "run"
		}
		server {
			server()
			configName = "Minecraft Server"
			ideConfigGenerated = true
			runDir = "run-server"
		}
		scenarioServer {
			server()
			configName = "Inferno Scenario Tests"
			source sourceSets.scenario
			runDir = "run-scenario"
			vmArg "-Dinferno.scenarios=true"
			vmArg "-Dinferno.mixinSelfTest=true"
			programArg "--nogui"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

test {
	useJUnitPlatform()
	systemProperty "updateDocs", System.getProperty("updateDocs", "false")
	workingDir = projectDir
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE_inferno-anticheat-fabric")
}

// A fresh flat world for every scenario run.
tasks.matching { it.name == "runScenarioServer" }.configureEach {
	doFirst {
		def dir = file("run-scenario")
		delete(dir)
		dir.mkdirs()
		new File(dir, "eula.txt").text = "eula=true\n"
		new File(dir, "server.properties").text = [
			"level-type=minecraft\\:flat",
			"online-mode=false",
			"spawn-protection=0",
			"generate-structures=false",
			"view-distance=3",
			"simulation-distance=3",
			"max-tick-time=-1",
			"spawn-monsters=false",
			"spawn-animals=false",
			"level-seed=inferno"
		].join("\n") + "\n"
	}
}

// Fabric API jar for the production smoke test (not part of the mod).
configurations {
	prodRuntimeMods {
		transitive = false
	}
}

dependencies {
	prodRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Starts the built jar in a production-style dedicated server (./gradlew prodServer). Stop it with "stop".
tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	mods.from(configurations.prodRuntimeMods)
	runDir = file("run-prod-server")
	jvmArgs.add("-Dinferno.mixinSelfTest=true")
	programArgs.add("--nogui")
	doFirst {
		def dir = file("run-prod-server")
		dir.mkdirs()
		new File(dir, "eula.txt").text = "eula=true\n"
		new File(dir, "server.properties").text = "level-type=minecraft\\:flat\nonline-mode=false\nview-distance=3\nsimulation-distance=3\n"
	}
}
